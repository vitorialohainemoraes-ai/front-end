<!DOCTYPE html>
<html lang="en">
    
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .campo{
            background-color: rgb(255, 195, 205);
            border: 1px;
        }
        .botao{
            width:5% ;
            height:3% ;
            background-color: rgb(255, 192, 203);
            border: 1px

        }
        .botao2{
            width:5% ;
            height:2% ;
            background-color: pink;
            border: 1px

        }
        .botao3{
            width:28% ;
            height:2% ;
            background-color: pink;
            border: 1px

        }
        .botao4{
            width:28% ;
            height:2% ;
            background-color: pink;
            border: 1px

        }
        
    </style>
    <script>
        function adicionar(valor){
            document.getElementById("campo").value += valor;
         }
         function limpar(){
            document.getElementById("campo").value = ""
         }
         function calcular(){
            var campo = document.getElementById("campo")
            try{
                campo.value= eval(campo.value);
            }catch(error){
                campo.value="erro";
            }
         }
    </script>
</head>
<body style="background-color: rgb(246, 131, 150);">
    <fieldset>
        
        <legend>Calculadora 2°A </legend>
        <input type="text" id="campo" class="campo"><br><br>
        <button class="botao" onclick="adicionar('1')">1</button>
        <button class="botao" onclick="adicionar('2')">2</button>
        <button class="botao" onclick="adicionar('3')">3</button>
        <button class="botao2" onclick="adicionar('*')">x</button>
        <button class="botao2" onclick="adicionar('^')">^</button><br>
        <button class="botao" onclick="adicionar('4')">4</button>
        <button class="botao" onclick="adicionar('5')">5</button>
        <button class="botao" onclick="adicionar('6')">6</button>
        <button class="botao2" onclick="adicionar('/')">/</button>
        <button class="botao2" onclick="adicionar('(')">(</button><br>
        <button class="botao" onclick="adicionar('7')">7</button>
        <button class="botao" onclick="adicionar('8')">8</button>
        <button class="botao" onclick="adicionar('9')">9</button>
        <button class="botao2" onclick="adicionar('+')">+</button>
        <button class="botao2" onclick="adicionar('-')">-</button><br>
        <button class="botao2" onclick="adicionar(')')">)</button>
        <button class="botao2" onclick="adicionar(',')">,</button>
        <button class="botao" onclick="adicionar('0')">0</button>
        <button class="botao2" onclick="adicionar('.')">.</button>
        <button class="botao2" onclick="adicionar('%')">%</button><br>
        <button class="botao3" onclick="limpar('C')">C</button><br>
        <button class="botao4" onclick="calcular('=')">=</button>
    </fieldset>
</body>
</html>
