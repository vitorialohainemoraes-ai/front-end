<!DOCTYPE html>
<html lang="en">
    
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .campo{
            background-color: rgb(255, 195, 205);
            border: 1px;
        }
        .botao{
            width:5% ;
            height:3% ;
            background-color: rgb(255, 192, 203);
            border: 1px

        }
        .botao2{
            width:5% ;
            height:2% ;
            background-color: pink;
            border: 1px

        }
        .botao3{
            width:5% ;
            height:2% ;
            background-color: pink;
            border: 1px

        }
        .botao4{
            width:5% ;
            height:2% ;
            background-color: pink;
            border: 1px

        }
        
    </style>
</head>
<body>
    <fieldset>
        
        <legend>Calculadora 2°A </legend>
        <input type="text" id="campo" class="campo"><br><br>
        <button class="botao">1</button>
        <button class="botao">2</button>
        <button class="botao">3</button>
        <button class="botao2">x</button>
        <button class="botao2">^</button><br>
        <button class="botao">4</button>
        <button class="botao">5</button>
        <button class="botao">6</button>
        <button class="botao2">/</button>
        <button class="botao2">(</button><br>
        <button class="botao">7</button>
        <button class="botao">8</button>
        <button class="botao">9</button>
        <button class="botao2">+</button>
        <button class="botao2">)</button><br>
        <button class="botao2">*</button>
        <button class="botao">0</button>
        <button class="botao2">#</button>
        <button class="botao2">%</button>
        <button class="botao3">C</button><br>
        <button class="botao4">=</button>
    </fieldset>
    
    
</body>
</html>
